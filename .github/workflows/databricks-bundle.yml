name: Databricks Bundle

on:
  push:
    branches:
      - dev

  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

jobs:
  deploy-dev:
    name: Deploy Dev Bundle
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment: dev
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Check Databricks authentication inputs
        run: |
          test -n "$DATABRICKS_HOST"
          test -n "$DATABRICKS_TOKEN"

      - name: Bootstrap Unity Catalog objects
        run: python3 scripts/bootstrap_unity_catalog.py

      - name: Validate dev bundle
        run: databricks bundle validate --target dev

      - name: Deploy dev bundle
        run: databricks bundle deploy --target dev

  deploy-prod:
    name: Deploy Prod Bundle
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'dev' &&
      github.event.pull_request.base.ref == 'main'
    environment: prod
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Check Databricks authentication inputs
        run: |
          test -n "$DATABRICKS_HOST"
          test -n "$DATABRICKS_TOKEN"

      - name: Bootstrap Unity Catalog objects
        run: python3 scripts/bootstrap_unity_catalog.py

      - name: Validate prod bundle
        run: databricks bundle validate --target prod

      - name: Deploy prod bundle
        run: databricks bundle deploy --target prod
